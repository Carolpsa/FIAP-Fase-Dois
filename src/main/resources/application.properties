spring.application.name=tech-challenge-restaurantes

# Banco de dados (os valores padrao funcionam com o docker-compose rodando o postgres na porta 5432)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurantes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria/atualiza as tabelas sozinho a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
