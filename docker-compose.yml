services:

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: restaurantes-db
    environment:
      POSTGRES_DB: restaurantes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # a aplicação só sobe depois que o banco estiver pronto
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurantes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplicação Java (Spring Boot)
  app:
    build: .
    container_name: restaurantes-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/restaurantes
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres-data:
